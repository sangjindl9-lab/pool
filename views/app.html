<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>착공계 원스톱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700&display=swap">
<style>
/* Layout: 상단 프로젝트 바 + 좌측 입력 패널(탭) + 우측 A4 미리보기 책상 */
:root{
  --bg:#e9edf1; --panel:#ffffff; --ink:#17202a; --muted:#5b6876; --line:#d3dae2; --field:#f6f8fa;
  --accent:#1d4f8c; --accent-soft:#e3ecf7; --stamp:#c0392b; --ok:#2d7a4c; --warn:#a86400; --desk:#cfd6de;
  --paper:#ffffff; --paper-ink:#111111;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --doc:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --doc-g:"Nanum Gothic","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --panel:#182029; --ink:#e2e8ee; --muted:#98a5b3; --line:#2b3642; --field:#121920;
  --accent:#86b4ee; --accent-soft:#1d2d42; --stamp:#ff7b6b; --ok:#6fcf97; --warn:#f2b45a; --desk:#0b0f14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#182029; --ink:#e2e8ee; --muted:#98a5b3; --line:#2b3642; --field:#121920;
  --accent:#86b4ee; --accent-soft:#1d2d42; --stamp:#ff7b6b; --ok:#6fcf97; --warn:#f2b45a; --desk:#0b0f14; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:6px}
.brand .mark{width:26px;height:26px;border:2px solid var(--stamp);color:var(--stamp);border-radius:50%;display:grid;place-items:center;font-size:12px;font-family:var(--doc);font-weight:800}
.projsel{min-width:0;flex:1 1 220px;max-width:420px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:0 8px}
.btn{height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.btn.danger{color:var(--stamp)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.save-state{font-size:12px;color:var(--muted);margin-left:auto}
.save-state b{font-weight:600;color:var(--ok)}
.userbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.userbox .who-name{font-size:12.5px;color:var(--muted)}
.userbox a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--stamp)}
.banner{padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,540px) 1fr}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
.form-pane{background:var(--panel);border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:8px 10px 0;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:8px 10px 9px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.form{flex:1;overflow:auto;padding:16px 18px 60px}
.sec{display:grid;gap:12px;margin-bottom:24px}
.sec h3{margin:0;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0;align-content:start}
.fld.full{grid-column:1/-1}
.fld>span{font-size:12px;color:var(--muted)}
.fld em{font-style:normal;font-size:11.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:0 9px;min-width:0;width:100%}
.fld textarea{height:auto;padding:8px 9px;resize:vertical}
.fld input[data-money]{text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}
.calc{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px;border-radius:6px;background:var(--field);border:1px dashed var(--line);font-size:13px}
.calc b{font-variant-numeric:tabular-nums;font-size:14px}
.calc.bad{border-color:var(--stamp);color:var(--stamp)}
.calc.good{border-color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel);font-weight:600}
/* editable tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.et{border-collapse:collapse;width:100%;font-size:12.5px}
table.et th{background:var(--field);color:var(--muted);font-weight:500;text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.et td{padding:3px;border-bottom:1px solid var(--line)}
table.et tr:last-child td{border-bottom:0}
table.et input{width:100%;min-width:56px;height:30px;border:1px solid transparent;border-radius:4px;background:transparent;padding:0 6px}
table.et input:hover{border-color:var(--line)}
table.et input:focus{border-color:var(--accent);background:var(--field)}
table.et input[data-money]{text-align:right;font-variant-numeric:tabular-nums}
table.et td.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:8px;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:4px}
.x:hover{color:var(--stamp);background:var(--field)}
.cat{font-weight:600;font-size:12.5px;margin:6px 0 4px;display:flex;justify-content:space-between}
/* images */
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:110px;height:140px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--field);display:grid;place-items:center}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb .x{position:absolute;top:2px;right:2px;background:var(--panel)}
.thumb .tno{position:absolute;left:4px;top:4px;font-size:11px;background:var(--panel);border-radius:3px;padding:0 4px;color:var(--muted)}
.thumb .mv{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:4px}
.thumb .mv .x{position:static;background:var(--panel)}
.thumb .mv .x:disabled{opacity:.3;cursor:default}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop{width:110px;height:140px;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:6px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.sealbox{width:110px;height:110px}
/* doc list */
.doclist{display:grid;gap:2px}
.docrow{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:6px}
.docrow:hover{background:var(--field)}
.docrow .t{cursor:pointer}
.docrow .t:hover{color:var(--accent)}
.pill{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.issues{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.45}
.issues .lv{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid}
.issues .lv.e{color:var(--stamp);border-color:var(--stamp)}
.issues .lv.w{color:var(--warn);border-color:var(--warn)}
.issues .lv.i{color:var(--muted);border-color:var(--line)}
.export{display:flex;flex-wrap:wrap;gap:8px}
/* preview */
.prev-pane{background:var(--desk)}
.prev-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.prev-bar select{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:0 8px;min-width:0;flex:1 1 200px;max-width:360px}
.prev-bar .pc{font-size:12px;color:var(--muted)}
.sheets{flex:1;overflow:auto;padding:20px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.sheet{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 22px rgba(0,0,0,.12);overflow:hidden;flex:none;position:relative}
.sheet>.page{transform-origin:0 0;position:absolute;left:0;top:0}
.sheet-cap{font-size:11.5px;color:var(--muted);margin-bottom:-10px;align-self:center}
.measure{position:absolute;left:-20000px;top:0;visibility:hidden}
.export-host{position:fixed;left:0;top:0;z-index:-1}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;z-index:50}
.overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 26px;min-width:260px;text-align:center;display:grid;gap:10px}
.bar-out{height:6px;background:var(--field);border-radius:3px;overflow:hidden}
.bar-in{height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.mtoggle{display:none}
.example-flag{font-size:11.5px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 6px}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .mtoggle{display:inline-flex}
  .main[data-view="form"] .prev-pane{display:none}
  .main[data-view="prev"] .form-pane{display:none}
  .grid{grid-template-columns:1fr}
  .form{padding:14px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ======== 서류(종이) 스타일: 테마와 무관하게 흰 종이 ======== */
.page{width:794px;height:1123px;box-sizing:border-box;padding:76px 72px 64px;background:#fff;color:#111;font-family:var(--doc);font-size:15px;line-height:1.6;position:relative}
.page.land{width:1123px;height:794px;padding:44px 40px 36px}
.page *{box-sizing:border-box}
.pbody{height:100%;overflow:hidden;position:relative}
.pno{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:12px;color:#444}
.std{display:flex;flex-direction:column;height:100%}
.sp{flex:1}
.sp2{flex:2}
.dt{font-size:34px;font-weight:800;text-align:center;letter-spacing:.55em;margin:0 0 0 .55em;font-family:var(--doc)}
.dt.md{font-size:28px;letter-spacing:.4em;margin-left:.4em}
.dt.sm{font-size:24px;letter-spacing:.25em;margin-left:.25em}
.formno{font-size:12px;font-family:var(--doc-g);display:flex;justify-content:space-between;margin-bottom:10px}
.kv{border-collapse:collapse;width:100%}
.kv th{text-align:justify;text-align-last:justify;text-justify:inter-character;font-weight:700;width:140px;padding:9px 0;vertical-align:top}
.kv td{padding:9px 0 9px 6px;vertical-align:top}
.kv td.colon{width:20px;padding-left:10px}
.kv.big{font-size:17px}
.kv.big th{width:150px}
.stmt{font-size:16.5px;text-align:center;margin:0}
.stmt.l{text-align:left;text-indent:1em;line-height:1.95}
.date-c{text-align:center;font-size:16.5px;letter-spacing:.06em}
.sig{border-collapse:collapse;margin-left:auto;margin-right:20px;font-size:15.5px}
.sig th{font-weight:700;text-align:justify;text-align-last:justify;width:72px;padding:3px 10px 3px 0;white-space:nowrap}
.sig td{padding:3px 0;white-space:nowrap}
.to{font-size:19px;font-weight:700;letter-spacing:.06em}
.to span{margin-left:14px;font-weight:700}
.in{position:relative;display:inline-block;margin-left:6px}
.seal-img{position:absolute;left:50%;top:50%;width:64px;height:64px;object-fit:contain;transform:translate(-50%,-50%);mix-blend-mode:multiply;opacity:.92}
table.fm{border-collapse:collapse;width:100%;font-size:14.5px}
table.fm th,table.fm td{border:1px solid #222;padding:7px 9px;vertical-align:middle}
table.fm th{font-weight:700;text-align:center;background:#f3f3f3;white-space:nowrap}
table.fm td.r{text-align:right;font-variant-numeric:tabular-nums}
table.fm td.c{text-align:center}
table.fm.thick{border:2px solid #111}
table.fm.small{font-size:12.5px}
table.fm.small th,table.fm.small td{padding:5px 7px}
table.fm.dense th,table.fm.dense td{padding:3px 7px}
.appr{display:flex;justify-content:flex-end}
.appr table{border-collapse:collapse;font-size:13.5px}
.appr th,.appr td{border:1px solid #222;text-align:center;padding:4px 10px}
.appr th.v{width:30px;line-height:1.15;padding:4px}
.appr td{height:62px;min-width:130px;position:relative;vertical-align:bottom}
/* 공문 */
.lh{text-align:center;border-bottom:3px double #111;padding-bottom:8px}
.lh .nm{font-size:30px;font-weight:800;letter-spacing:.15em}
.lh .ad{font-size:12.5px;font-family:var(--doc-g)}
.lt{display:grid;grid-template-columns:1fr 250px;gap:16px;margin-top:16px}
.lt table.kv th{width:96px;padding:4px 0}
.lt table.kv td{padding:4px 0 4px 8px}
.rcv{border-collapse:collapse;font-size:11.5px;font-family:var(--doc-g);width:100%}
.rcv td,.rcv th{border:1px solid #333;padding:3px 5px;font-weight:400;height:22px}
.subj{border-top:1px solid #111;border-bottom:1px solid #111;padding:10px 0;margin:18px 0 18px;font-size:16px}
.subj b{display:inline-block;width:96px;text-align:justify;text-align-last:justify;margin-right:8px}
.lbody p{margin:0 0 6px;padding-left:2em;text-indent:-1.2em;line-height:1.9}
.lfoot{text-align:center;font-size:21px;font-weight:800;letter-spacing:.08em}
/* 표지 */
.cov{display:flex;flex-direction:column;align-items:center;height:100%;text-align:center;position:relative;padding:0 30px}
.cov .ct{font-size:46px;font-weight:800;letter-spacing:.5em;margin-left:.5em;margin-top:150px}
.cov .cn{font-size:21px;font-weight:700;margin-top:56px;max-width:560px;line-height:1.6}
.cov .cd{font-size:19px;letter-spacing:.08em}
.cov .cc{font-size:28px;font-weight:800;letter-spacing:.12em;margin-bottom:60px}
.cov .frame{position:absolute;inset:8px;border:1.5px solid #111;outline:5px double #111;outline-offset:6px;pointer-events:none}
/* 공정표 */
table.gantt{border-collapse:collapse;width:100%;font-family:var(--doc-g);font-size:11.5px;table-layout:fixed}
table.gantt th,table.gantt td{border:1px solid #333;padding:0 3px;text-align:center}
table.gantt th{background:#f1f1f1;font-weight:700;height:24px}
table.gantt td.nm{text-align:left;padding:0 5px;line-height:1.15;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.gantt td.cell{position:relative;padding:0}
table.gantt .gb{position:absolute;top:28%;height:30%;background:#1f3f73}
table.gantt .gv{position:absolute;bottom:1px;left:0;right:0;font-size:8.5px;color:#333;line-height:1}
table.gantt tr.sum td{background:#f7f7f7;font-weight:700;height:22px;font-size:10.5px;white-space:nowrap;overflow:hidden}
.gnote{font-size:11.5px;font-family:var(--doc-g);margin-top:6px}
/* 서식 본문 (계획서) */
.h1{font-size:22px;font-weight:800;margin:0 0 14px}
.h2{font-size:17px;font-weight:800;margin:10px 0 8px}
.h3{font-size:15.5px;font-weight:700;margin:8px 0 6px;padding-left:.8em}
.pp{margin:0 0 6px;padding-left:2.2em;line-height:1.8}
.pi{margin:0 0 4px;padding-left:3.6em;text-indent:-1.4em;line-height:1.75}
.pi2{margin:0 0 3px;padding-left:5em;text-indent:-1.2em;line-height:1.7}
.blk{padding-bottom:0}
.toc{width:76%;margin:30px auto 0;font-size:16px}
.toc div{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted #999}
.toc div.s{padding-left:1.6em;font-size:15px}
.org{display:flex;flex-direction:column;align-items:center;gap:0;margin:10px 0 6px;font-family:var(--doc-g)}
.org .b{border:1.5px solid #111;padding:8px 14px;min-width:220px;text-align:center;font-size:13.5px;line-height:1.45;background:#fff}
.org .b small{display:block;font-size:11.5px;color:#444}
.org .v{width:1.5px;height:22px;background:#111}
.org .row{display:flex;align-items:center}
.org .h{height:1.5px;width:40px;background:#111;border-top:1.5px dashed #111;background:none}
.org .side{border:1.5px dashed #111;padding:6px 10px;font-size:12.5px;text-align:center;width:150px;flex:none}
.org .sidesp{width:190px;flex:none}
.org .lvl{display:flex;justify-content:center}
.org .nd{position:relative;padding:16px 5px 0}
.org .nd::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1.5px solid #111}
.org .nd::after{content:"";position:absolute;top:0;left:0;right:0;border-top:1.5px solid #111}
.org .nd:first-child::after{left:50%}
.org .nd:last-child::after{right:50%}
.org .b.m{min-width:96px;padding:6px 8px;font-size:12px}
.flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-family:var(--doc-g);font-size:12.5px;margin:6px 0 10px}
.flow span.b{border:1.2px solid #111;padding:5px 9px}
.attach{display:flex;flex-direction:column;height:100%}
.attach .lab{font-family:var(--doc-g);font-size:13px;display:flex;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:6px}
.attach .im{flex:1;display:grid;place-items:center;min-height:0;padding:14px 0}
.attach .im img{max-width:100%;max-height:100%;object-fit:contain}
.attach .im{display:flex;flex-direction:column;gap:14px}
.attach .ai{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}

<script>
"use strict";
/* ================= 유틸 ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{if(typeof v==='number')return v;const n=Number(String(v??'').replace(/[^\d.\-]/g,''));return isFinite(n)?n:0};
const won=n=>Math.round(num(n)).toLocaleString('ko-KR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function numKo(n){n=Math.floor(Math.abs(num(n)));if(!n)return '영';const d='영일이삼사오육칠팔구',u=['','십','백','천'],big=['','만','억','조','경'];let s='',g=0;while(n>0){const part=n%10000;if(part){const ds=String(part).padStart(4,'0');let p='';for(let i=0;i<4;i++){const k=+ds[i];if(k)p+=d[k]+u[3-i];}s=p+big[g]+s;}n=Math.floor(n/10000);g++;}return s;}
const amtKo=n=>`일금 ${numKo(n)}원정(₩${won(n)})`;
function pd(s){if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));}
const iso=d=>d?d.toISOString().slice(0,10):'';
const p2=n=>String(n).padStart(2,'0');
const fDot=s=>{const d=pd(s);return d?`${d.getUTCFullYear()}. ${p2(d.getUTCMonth()+1)}. ${p2(d.getUTCDate())}`:'    .   .   ';};
const fKo=s=>{const d=pd(s);return d?`${d.getUTCFullYear()}년 ${p2(d.getUTCMonth()+1)}월 ${p2(d.getUTCDate())}일`:'      년    월    일';};
const DAY=86400000;
const daysIncl=(a,b)=>{const x=pd(a),y=pd(b);return x&&y?Math.round((y-x)/DAY)+1:0;};
const addDays=(s,n)=>{const d=pd(s);return d?iso(new Date(+d+n*DAY)):'';};
const josa=(w,a,b)=>{const c=String(w||'').trim().slice(-1).charCodeAt(0);if(!(c>=0xAC00&&c<=0xD7A3))return a+'('+b+')';return (c-0xAC00)%28?a:b;};
const spaced=(s,g='&nbsp;&nbsp;')=>{s=String(s||'').trim();if(!s)return '';if(/\s/.test(s)||s.length>4)return esc(s);return [...s].map(esc).join(g);};
const r2=n=>Math.round(n*100)/100;
const fmtPct=n=>{const v=r2(n);return v?String(v):'';};
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}

/* ================= 데이터 모델 ================= */

  o.scopes=o.scopes||{};['all','first'].forEach(k=>{const e=emptyScope(),s=o.scopes[k]||{};
    o.scopes[k]=Object.assign(e,s);o.scopes[k].direct=Object.assign(e.direct,s.direct||{});
    o.scopes[k].safety=Object.assign(emptySafety(),s.safety||{});
    const sc=s.sched||{};o.scopes[k].sched={fixed:Object.assign(e.sched.fixed,sc.fixed||{}),rows:sc.rows||[]};});
  o.attachLayout=Object.assign({license:1,career:1},(p||{}).attachLayout||{});
  o.works=o.works||[];o.workers=o.workers||[];o.docs=o.docs||{};return o;}

/* 예시: 업로드한 착공계 엑셀을 기준으로 구성 (개인 식별번호는 비움) */

  name:'○○부대 시설 개편사업 통신공사 (예시)',trade:'통신',contractNo:'0000ABCD000',owner:'○○분임계약관',honor:'귀청',via:'○○감리단',ref:'담당자',inspector:'김감독',
  site:'○○도 ○○시 ○○길 00',siteDesc:'○○부대 내',longTerm:true,contractDate:'2023-12-28',startDate:'2024-01-08',submitDate:'2024-01-08',docNo:'EX2024-01호',copies:3,sealTo:'○○분임계약관'});
  const a=p.scopes.all;a.amount=620120000;a.end='2025-11-10';
  Object.assign(a.direct,{kind:'전기',sub:'기타',direct:397742096,labor:24428571,insurance:41452162,safety:13046113,expense:25656203,overhead:27906227,profit:28461094,waste:5060810,adjust:-7820});
  a.safety.c2=[{period:'2024.01 ~ 2025.11',name:'사다리전도방지대',unit:'set',price:200000,qty:4}];
  a.safety.c3=[['안전화','족',120000,40],['안전모','개',12000,42],['안전각반','장',2500,48],['X형 안전띠','개',150000,40],['방진마스크','개',1500,600],['분진복','벌',10000,60],['안전화커버','pair',2000,200]].map(r=>({period:'2024.01 ~ 2025.11',name:r[0],unit:r[1],price:r[2],qty:r[3]}));
  a.safety.c6=[{period:'2024.01 ~ 2025.11',name:'안전구급의약품함',unit:'SET',price:100000,qty:4},{period:'2024.01 ~ 2025.11',name:'제빙기 임대',unit:'대',price:300000,qty:1}];
  a.sched.rows=[['옥외통신설비공사',22033159],['병영식당 전화및LAN설비공사',20691918],['병영식당 방송설비공사',20691918],['병영식당 CCTV설비공사',20691918],['병영식당 원격검침설비공사',20691918],['일반창고 전화및LAN설비공사',20691918],['일반창고 방송설비공사',20691918],['일반창고 CABLE TRAY설비공사',20691918],['정비공장 전화및LAN설비공사',20691918],['정비공장 방송설비공사',20691918],['일반창고 CCTV설비공사',15925764],['정비공장 CABLE TRAY설비공사',2550464],['행정시설 전화및LAN설비공사',2550464],['행정시설 방송설비공사',2550464],['행정시설 CCTV설비공사',2550464],['행정시설 원격검침설비공사',2550464],['행정시설 CABLE TRAY설비공사',2550464]].map(r=>({name:r[0],amount:r[1],s:'',e:''}));
  const f=p.scopes.first;f.amount=100000000;f.end='2024-08-31';
  f.sched.rows=[['옥외통신설비공사',22033159],['전화및LAN설비공사',20691918],['방송설비공사',20691918],['CCTV설비공사',15925764],['CABLE TRAY설비공사',2550464]].map(r=>({name:r[0],amount:r[1],s:'',e:''}));
  f.direct.kind='전기';f.direct.sub='기타';
  p.agent=Object.assign(p.agent,{name:'박현장',licType:'전기기능사',licGrade:'통신초급',licNo:'0000-00000-000',joinDate:'2014-01-02',position:'부장',dept:'통신사업부',certNo:'2024-001'});
  p.gm.addr='○○도 ○○시 ○○로 00';
  p.works=['옥외통신설비공사','전화및LAN설비공사','방송설비공사','CCTV설비공사','원격검침설비공사','CABLE TRAY설비공사'].map(n=>({name:n,qty:'1식'}));
  p.workers=[['박현장','현장대리인'],['최소장','현장소장'],['정과장','과장'],['강전공','전공'],['조전공','전공']].map(r=>({name:r[0],birth:'',role:r[1]}));
  return p;}

/* ================= 저장소 (계정 저장소 우선, 없으면 이 브라우저) ================= */
const Store={mode:'api',
  async req(path,opts={}){const r=await fetch('/api/data'+path,{method:opts.method||'GET',headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:opts.body!==undefined?JSON.stringify(opts.body):undefined,credentials:'same-origin'});
    let j={};try{j=await r.json();}catch(_){}
    if(r.status===401){location.href='/login';throw new Error('login');}
    if(r.status===403){location.href='/license';throw new Error(j.error||'license');}
    if(!r.ok){const e=new Error(j.error||'저장 실패');e.code=r.status;throw e;}return j;},
  async connect(){return true;},
  async loadAll(){return this.req('/');},
  async saveCompany(c){return this.req('/company',{method:'PUT',body:c});},
  async saveProject(p){return this.req('/projects/'+encodeURIComponent(p.id),{method:'PUT',body:p});},
  async deleteProject(id){return this.req('/projects/'+encodeURIComponent(id),{method:'DELETE'});},
  async saveImg(id,data){return this.req('/images/'+encodeURIComponent(id),{method:'PUT',body:{data}});},
  async loadImg(id){try{const r=await this.req('/images/'+encodeURIComponent(id));return r.data;}catch(e){return null;}},
  async deleteImg(id){return this.req('/images/'+encodeURIComponent(id),{method:'DELETE'});}
};

/* ================= 상태 ================= */
let C=exampleCompany();
let projects=[exampleProject()];
let P=projects[0];
let tab='basic', formScope='all', curDoc='letter', delConfirm=false;
const imgCache={};
const dirty={company:false,project:new Set()};
let saveTimer=null, renderTimer=null, focusOrg=false, focus47=false;

function setSave(t,ok){const el=$('#saveState');el.innerHTML=ok?`<b>●</b> ${esc(t)}`:esc(t);}
function storeLabel(){return '서버에 저장됨';}

function markDirty(kind){if(kind==='c'){if(C._example)delete C._example;dirty.company=true;}else{if(P._example)delete P._example;P.updated=Date.now();dirty.project.add(P.id);}
  setSave('저장 대기…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,800);}
async function flush(){try{if(dirty.project.size&&C._example){delete C._example;dirty.company=true;}
  if(dirty.company){dirty.company=false;await Store.saveCompany(C);}
  for(const id of [...dirty.project]){dirty.project.delete(id);const p=projects.find(x=>x.id===id);if(p&&!p._example)await Store.saveProject(p);}
  setSave(storeLabel(),true);renderProjSel();}
  catch(e){setSave('저장 실패 — 백업 파일로 내보내 두세요');}}

/* ================= 파생 값 ================= */
const scopeKeys=()=>P.longTerm?['all','first']:['all'];
const scopeLabel=k=>P.longTerm?(k==='all'?'전체':'1차'):'';
function directCalc(d){const v=k=>num(d[k]);const subtotal=v('direct')+v('labor')+v('insurance')+v('safety');
  const total=subtotal+v('expense')+v('overhead')+v('profit')+v('waste')+v('adjust');
  const vat=String(d.vat??'').trim()!==''?v('vat'):Math.floor(total*0.1);
  const grand=Math.trunc((total+vat)/100)*100;return {subtotal,total,vat,grand,any:subtotal+total>0};}
function safetyCalc(s){const cats={};let sum=0;SAFETY_CATS.forEach(([k])=>{const t=(s.safety[k]||[]).reduce((a,r)=>a+num(r.price)*num(r.qty),0);cats[k]=t;sum+=t;});return {cats,sum,budget:num(s.direct.safety)};}
function schedRows(sk){const s=P.scopes[sk];const start=P.startDate,end=s.end;const span=Math.max(daysIncl(start,end)-1,0);
  const dflt=(a,b)=>[addDays(start,Math.round(span*a)),addDays(start,Math.round(span*b))];
  const fx=s.sched.fixed;const fixedSum=[...FIXED_ROWS,...FIXED_TAIL].reduce((a,[k])=>a+num(fx[k].w),0);
  const rest=Math.max(100-fixedSum,0);const rows=s.sched.rows;const tot=rows.reduce((a,r)=>a+num(r.amount),0);
  const out=[];
  FIXED_ROWS.forEach(([k,n,,a,b])=>{const d=dflt(a,b);out.push({key:k,name:n,w:num(fx[k].w),s:fx[k].s||d[0],e:fx[k].e||d[1],fixed:true});});
  const N=rows.length;rows.forEach((r,i)=>{const a=.12+(N>1?(.55*i/(N-1)):0)*.6,b=Math.min(a+.45,.9);const d=dflt(a,b);
    out.push({idx:i,name:r.name,amount:num(r.amount),w:tot?num(r.amount)/tot*rest:(N?rest/N:0),s:r.s||d[0],e:r.e||d[1]});});
  FIXED_TAIL.forEach(([k,n,,a,b])=>{const d=dflt(a,b);out.push({key:k,name:n,w:num(fx[k].w),s:fx[k].s||d[0],e:fx[k].e||d[1],fixed:true});});
  return out;}
function months(sk){const a=pd(P.startDate),b=pd(P.scopes[sk].end);if(!a||!b||b<a)return [];const out=[];let y=a.getUTCFullYear(),m=a.getUTCMonth();
  while(y<b.getUTCFullYear()||(y===b.getUTCFullYear()&&m<=b.getUTCMonth())){const ms=new Date(Date.UTC(y,m,1)),me=new Date(Date.UTC(y,m+1,0));out.push({y,m,ms,me});m++;if(m>11){m=0;y++;}if(out.length>240)break;}return out;}
function distribute(row,mons){const s=pd(row.s),e=pd(row.e);if(!s||!e||e<s)return mons.map(()=>({v:0,l:0,w:0}));const total=(e-s)/DAY+1;
  return mons.map(M=>{const a=new Date(Math.max(+s,+M.ms)),b=new Date(Math.min(+e,+M.me));if(b<a)return {v:0,l:0,w:0};const d=(b-a)/DAY+1;const md=(M.me-M.ms)/DAY+1;
    return {v:row.w*d/total,l:((a-M.ms)/DAY)/md*100,w:d/md*100};});}
function ag(){return P.agent;}
function safetyPerson(){return P.safetyMgr.same?{name:P.agent.name,grade:[P.agent.licType,P.agent.licGrade].filter(Boolean).join('(')+(P.agent.licGrade&&P.agent.licType?')':''),licNo:P.agent.licNo,phone:P.agent.phone}:P.safetyMgr;}
function gmPerson(){return P.gm.same?{name:P.agent.name,birth:P.agent.rrn6?birthFromRrn(P.agent.rrn6,P.agent.rrn1):'',addr:P.gm.addr||P.agent.addr}:P.gm;}
function disasterPerson(){return P.disaster.sameCeo?{name:C.ceo,birth:C.ceoBirth}:P.disaster;}
function birthFromRrn(r6,r1){if(!/^\d{6}$/.test(r6||''))return '';const c=['1','2','5','6'].includes(String(r1))?'19':['3','4','7','8'].includes(String(r1))?'20':(+r6.slice(0,2)>30?'19':'20');return `${c}${r6.slice(0,2)}-${r6.slice(2,4)}-${r6.slice(4,6)}`;}

/* ---------- 4. 예정공정표 ---------- */
function D_sched(sk){const s=P.scopes[sk];const rows=schedRows(sk);const mons=months(sk);const lab=scopeLabel(sk);
  const step=mons.length<=24?1:mons.length<=48?2:mons.length<=72?3:6;
  if(mons.length&&step>1){const g=[];mons.forEach(M=>{const key=M.y*12+Math.floor(M.m/step)*step;const last=g[g.length-1];if(last&&last.key===key){last.me=M.me;last.m1=M.m;}else g.push({key,y:M.y,m:M.m,m1:M.m,ms:M.ms,me:M.me});});mons.length=0;mons.push(...g);}
  const unitLabel={1:'',2:'2개월 단위',3:'분기 단위',6:'반기 단위'}[step];
  const colW=(1123-80-190-44-46)/Math.max(mons.length,1);const sumFs=colW<26?8.5:colW<34?9.5:10.5;
  const fmtSum=v=>{if(!v)return '';return colW<34?String(Math.round(v*10)/10):fmtPct(v);};
  const headLabel=M=>step===3?`${Math.floor(M.m/3)+1}분기`:step===6?(M.m<6?'상반기':'하반기'):step===1?`${M.m+1}${mons.length>18?'':'월'}`:(M.m===M.m1?`${M.m+1}`:`${M.m+1}~${M.m1+1}`);
  if(!mons.length)return [{page:`<div class="std"><h1 class="dt md">공사예정공정표</h1><div class="sp"></div><p class="stmt">착공일과 ${lab?lab+' ':''}준공예정일을 입력하면 공정표가 그려집니다.</p><div class="sp"></div></div>`,land:true}];
  const dist=rows.map(r=>distribute(r,mons));const sub=mons.map((_,i)=>dist.reduce((a,d)=>a+d[i].v,0));let acc=0;const cum=sub.map(v=>(acc+=v));
  const tw=rows.reduce((a,r)=>a+r.w,0);
  const avail=430;const rh=Math.max(18,Math.min(34,Math.floor(avail/Math.max(rows.length,1))));
  const yrs={};mons.forEach(M=>{yrs[M.y]=(yrs[M.y]||0)+1;});
  const small=mons.length>18;
  return [{land:true,page:`<div style="display:flex;flex-direction:column;height:100%">
<h1 class="dt md" style="font-size:24px">공 사 예 정 공 정 표${lab?` ( ${lab} )`:''}</h1>
<div style="display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--doc-g);font-size:13px;margin:10px 0 6px">
<div>공 사 명 : <b>${esc(P.name)}</b><br>공사기간 : ${fKo(P.startDate)} ~ ${fKo(s.end)} (착수일로부터 ${daysIncl(P.startDate,s.end)}일)${unitLabel?`&nbsp;&nbsp;·&nbsp;&nbsp;공정 구분 : ${unitLabel}`:''}</div>
<div>${esc(C.name)}&nbsp;&nbsp;대표이사&nbsp;&nbsp;${spaced(C.ceo)}&nbsp;${sealHtml()}</div></div>
<table class="gantt"><colgroup><col style="width:190px"><col style="width:44px">${mons.map(()=>'<col>').join('')}<col style="width:46px"></colgroup>
<thead><tr><th rowspan="2">공&nbsp;&nbsp;&nbsp;종</th><th rowspan="2">보할<br>(%)</th>${Object.entries(yrs).map(([y,n])=>`<th colspan="${n}">${y}년</th>`).join('')}<th rowspan="2">비고</th></tr>
<tr>${mons.map(M=>`<th style="font-weight:400;font-size:${colW<30?9.5:11.5}px;padding:0 1px;white-space:nowrap">${headLabel(M)}</th>`).join('')}</tr></thead>
<tbody>${rows.map((r,ri)=>`<tr style="height:${rh}px"><td class="nm">${esc(r.name)}</td><td>${fmtPct(r.w)}</td>${dist[ri].map(c=>`<td class="cell">${c.w?`<div class="gb" style="left:${c.l}%;width:${c.w}%"></div>${rh>=24&&!small?`<span class="gv">${fmtPct(c.v)}</span>`:''}`:''}</td>`).join('')}<td></td></tr>`).join('')}
<tr class="sum"><td>소&nbsp;&nbsp;&nbsp;계</td><td>${fmtPct(tw)}</td>${sub.map(v=>`<td style="font-size:${sumFs}px;padding:0 1px">${fmtSum(v)}</td>`).join('')}<td></td></tr>
<tr class="sum"><td>누&nbsp;&nbsp;&nbsp;계</td><td></td>${cum.map(v=>`<td style="font-size:${sumFs}px;padding:0 1px">${fmtSum(v)}</td>`).join('')}<td></td></tr></tbody></table>
<div class="gnote">※ 보할은 공종별 내역금액 비율로 산정 (고정공종 제외 ${r2(100-[...FIXED_ROWS,...FIXED_TAIL].reduce((a,[k])=>a+num(s.sched.fixed[k].w),0))}% 배분). 상기 일정은 현장상황 및 타분야 연계공정에 따라 변동될 수 있음.</div></div>`}];}

    const grp=multi?`<div class="lvl">${bs.map(b=>`<div class="nd">${box(b,true)}</div>`).join('')}</div>`:box(bs[0]);

    return (i?'<div class="v"></div>':'')+row;}).join('')}</div>`;}
function contactTable(){const e=P.emergency,s=safetyPerson();const rows=[['발주처','감독관',P.inspector,e.inspectorTel],['감리단',e.supervisor||P.via,'',e.supervisorTel],['본사',C.name,C.ceo,C.tel],['현장','현장대리인',P.agent.name,P.agent.phone],['현장','안전관리담당자',s.name,s.phone||P.agent.phone],['의료기관',e.hospital,'',e.hospitalTel],['소방서',e.fire,'',e.fireTel],['경찰서',e.police,'',e.policeTel]];

function D_safetyPlan(){const B=(h)=>({block:h});const out=planCover('안전관리계획서',SAFE_TOC);
  const items=[...overviewBlocks('safety'),
    B(`<div class="h1" style="margin-top:14px">2. 안전관리조직</div>${orgChart()}<p class="pp" style="font-size:13px">※ 산업안전보건 총괄책임자 선임계 붙임</p>`),
    B(`<div class="h1" style="margin-top:14px">3. 비상연락망</div>${contactTable()}`),
    {block:`<div class="h1">4. 안전관리 세부계획</div><div class="h3">4. 1 안전목표</div><table class="fm small"><colgroup><col style="width:38%"><col style="width:62%"></colgroup><tr><th>안 전 목 표</th><th>세 부 목 표</th></tr><tr><td style="line-height:2">1. 인간존중<br>2. 경영활동 안전관리 우선<br>3. 안전시공 추구<br>4. 안전 선진화 실현<br>5. 무재해 달성</td><td style="line-height:1.8">• 인명의 안전 확보<br>• 교육 및 훈련 철저<br>• 비상 시 대처능력 유지<br>• 품질방침에 기술된 원칙에 적합한 시스템 관리 및 유지<br>• 발생 가능한 모든 위험에 대비한 적절한 조치 및 미비사항 시정조치<br>• 사고 및 준사고에 대한 신속하고 정확한 보고<br>• 감리단과 상호 의견교환 및 부적합 사항의 시정조치</td></tr></table>`,newPage:true},
    B(`<div class="h3">4. 2 현장 안전관리 주요활동</div>${['공사 진행 시 투입되는 당사 인원은 해당 감독관의 지시에 순응하게 하고, 안전상의 문제는 일차적으로 해당 감독관의 승인을 득한 후 공사를 진행한다.','안전관리 담당자는 본 공사의 안전관리 총책임자로 하고, 부책임자를 지정하여 공사에 투입되는 당사 인원의 안전관리를 전담하도록 한다.','매일 공사 종료 후 현장 안전관리 및 공사 책임자는 해당 감독관에게 당일의 안전관리상 문제를 보고하고, 명일 작업 및 예정사항과 안전관리상 유의점을 지시받는다.','매일 현장 투입 전 작업인원의 신체 상태와 장구 상태를 점검하고 금일 작업사항을 설명하여 안전사고를 미연에 방지한다.','현장에 투입하는 인원은 반드시 안전모를 착용하게 하고 해당 작업에 필요한 안전장비를 투입한다.','사고 발생에 대비하여 구급상비약을 준비하고 인근 병원으로 이송할 수 있도록 한다.'].map((t,i)=>`<p class="pi">${'가나다라마바'[i]}. ${t}</p>`).join('')}`),
    B(`<div class="h3">4. 3 개인착용 안전장구명세</div><p class="pi">가. 개인착용 안전장구 : ① 안전모 ② 안전허리띠 ③ 안전허리띠 로프 ④ 안전화 ⑤ 보조로프 ⑥ 각반</p><p class="pi">나. 복장</p><p class="pi2">㉠ 간편하고 단정한 복장을 하며, 신발끈은 밖으로 노출시키지 않는다. 뺀치·칼·드라이버·스패너 등 개인공구는 공구꽂이에 넣어 휴대하고 필요한 안전장구는 반드시 휴대한다.</p><p class="pi2">㉡ 단추가 떨어진 작업복, 몸에 맞지 않는 큰 옷이나 끌리는 바지, 미끄러운 장소의 징 박은 구두, 기름 묻은 장소의 고무창 신발, 머리에 완전히 고정되지 않는 안전모는 착용하지 않는다.</p><p class="pi">다. 안전장구</p><p class="pi2">㉠ 공구는 사용 전 반드시 점검하여 흠이 있거나 마모된 것은 사용하지 않으며, 체인블록·윈치·잭 등 강도를 요하는 공구는 특히 세밀히 점검한다.</p><p class="pi2">㉡ 공구는 본래의 용도에만 사용하고, 안전허리띠 등 안전장구는 사용 전 점검하여 안전함을 확인한다.</p><p class="pi2">㉢ 공구 및 안전장구의 사용목적과 사용방법을 사전에 충분히 숙지한다.</p>`),
    B(`<div class="h3">4. 4 현장안전관리 조직 및 임무</div><table class="fm small"><colgroup><col style="width:26%"><col style="width:74%"></colgroup><tr><th>구 분</th><th>임 무</th></tr>
<tr><td class="c">안전보건관리책임자</td><td>산업재해 예방계획 수립 / 안전보건관리규정 작성 / 근로자 안전보건교육 / 작업환경 점검 및 개선 / 근로자 건강진단 등 보건관리</td></tr>
<tr><td class="c">현장대리인</td><td>급박한 위험 시 작업중지 및 재개 / 종합안전계획 수립·시행 / 도급사업 안전·보건조치 / 안전관리비 집행 감독 및 협의조정 / 유해·위험기계 사용 시 안전 확인</td></tr>
<tr><td class="c">안전관리담당자</td><td>안전교육 계획 수립·시행 / 사업장 순회점검·지도 및 조치 건의 / 재해원인 조사·대책 수립 및 보고 / 안전수칙 위반자 조치 건의 / 방호조치 및 검사 적격품 선정</td></tr>
<tr><td class="c">분야별 담당자</td><td>안전장치 및 보호구 구입·배포 / 안전 관련 상벌 평가 및 발의 / 유해위험방지계획서 작성 지도 / 산재 원인분석 및 예방대책 보고</td></tr></table>`),
    B(`<div class="h3">4. 5 안전보건 교육 및 점검</div><p class="pi">가. 안전교육</p><p class="pi2">• 정기교육 : 관리책임자는 전 근로자에 대하여 매월 2시간 이상 정기 안전보건교육을 실시한다.</p><p class="pi2">• 채용 시 및 작업내용 변경 시 교육 : 신규채용 및 작업내용 변경 시 작업 종사 전 2시간 이상 실시한다.</p><p class="pi2">• 특별교육 : 산업안전보건법령에 따른 유해·위험작업 종사 전 2시간 이상 실시하며, 미이수자는 해당 작업에 종사시키지 않는다.</p>
<p class="pi">나. 교육 실시 계획</p><p class="pi2">① 현장대리인은 매일 작업 전 안전회의(TBM)를 실시하여 작업내용·방법·구역 및 예상 위험을 교육하고 회의록을 기록·유지한다.</p><p class="pi2">② 수시로 현장 안전계몽 교육을 실시하고, 공정이 바뀔 때마다 작업방법을 충분히 교육한다.</p>
<p class="pi">다. 기록유지 : 교육 실시 후 이수 확인을 받아 교육일지를 작성·보관하고, 사업 종료 시 안전담당 부서로 이관한다.</p>
<p class="pi">라. 법정교육 : 관리책임자 및 안전관리자는 법정 직무교육을 이수한다.</p>
<p class="pi">마. 안전점검</p><p class="pi2">• 정기점검 연 4회 이상, 수시점검(민원 예상·고소작업 현장), 특별점검(중대재해 발생, 위험요인 다수 시)을 실시한다.</p><p class="pi2">• 일일점검으로 장비·차량·시설물을 점검하고, 새로운 장비 반입이나 공정 착수 전 위험요소를 분석하여 특별점검을 실시한다.</p><p class="pi2">• 점검 결과 위험요소가 있는 경우 시정지시서를 발부하고 신속히 시정한다.</p>`),
    B(`<div class="h3">4. 6 안전관리</div><p class="pi">가. 무재해 운동 : 무재해 및 잠재위험 발굴운동 세부계획을 수립하여 현장 실정에 맞게 추진한다.</p><p class="pi">나. 안전조치 : 작업자의 비적격성, 안전위반 행위, 기구 결손 여부, 작업장 안전상태, 부적당한 작업상태를 확인하고 시정 조치한다.</p><p class="pi">다. 안전표지 : 작업에 적합한 안전수칙과 안전표지를 부착하며, 산업안전보건법 시행규칙의 규정에 따른다.</p><p class="pi">라. 긴급 시 조치 : 산업재해의 급박한 위험이 있을 때에는 즉시 작업을 중지하고 근로자를 대피시킨다.</p><p class="pi">마. 휴무 중 안전조치 : 2일 이상 휴무 시 순찰 강화, 비상연락망 정비 등 별도의 안전조치를 취한다.</p><p class="pi">바. 유해·위험작업 : 고열·저온·분진·소음·진동·중량물 취급 등 유해·위험작업은 근로시간 제한 및 건강보호 조치를 한다.</p>`),
    ...plan47Blocks(),
    ...HAZ.map((g,i)=>B((i===0?`<div class="h3">4. 8 위험요인별 안전대책</div>`:'')+hazTable(g,i===0))),
    B(`<div class="h3" style="margin-top:10px">4. 9 현장 내 화재사고 예방대책</div><p class="pi">가. 화재감시자 배치 대상 작업 : 작업반경 11m 이내에 가연성 물질이 있는 장소, 바닥 하부 가연성 물질이 불꽃에 의해 쉽게 발화될 우려가 있는 장소, 칸막이·벽·천장 반대편 가연성 물질이 열전도·복사로 발화될 우려가 있는 장소에서의 용접·용단 작업</p><p class="pi">나. 배치 제외 : 동일 장소에서 상시·반복적으로 용접·용단을 하며 경보설비와 소화설비가 갖추어진 경우</p><p class="pi">다. 화재감시자 : 화재 위험을 감시하고 화재 발생 시 근로자 대피를 유도하는 업무만 전담하며, 건설업 기초안전보건교육을 이수한 자로 지정한다.</p><p class="pi">라. 화기작업 시 소화기를 비치하고 작업 후 30분 이상 잔불 여부를 확인한다.</p>`),
    B(`<div class="h3">4.10 추락·전도위험 예방대책</div><table class="fm small"><colgroup><col style="width:8%"><col style="width:80%"><col style="width:12%"></colgroup><tr><th>번호</th><th>점 검 내 용</th><th>확 인</th></tr>${['추락위험이 있는 장소에 작업발판이 설치되어 있는가','작업발판이나 개구부 덮개는 충분한 강도의 재료로 견고하게 설치되어 있는가','작업발판 및 통로의 끝, 개구부 등 추락위험 장소에 안전난간이 설치되어 있는가','안전대 부착설비 및 안전대의 이상 유무를 작업 시작 전 점검하였는가','안전난간 설치가 곤란한 추락위험 장소에 추락방호망이 설치되어 있는가','이동식사다리는 전도방지 조치 후 2인 1조로 사용하며 최상부 발판에서 작업하지 않는가','근로자는 개인보호구를 올바르게 착용하였는가'].map((t,i)=>`<tr style="height:30px"><td class="c">${i+1}</td><td>${t}</td><td></td></tr>`).join('')}</table>`)];
  return [...out,{page:`<div style="height:90px"></div><h1 class="dt">안 전 관 리 계 획</h1>`,merge:true},...items];}

   B(`<div class="h2">2. 2 품질관리(보증)</div><div class="h3">2.2.1 품질관리(보증)의 계획수립</div><p class="pi">가. 품질관리계획의 총괄은 현장대리인이 주관하고, 계획 변경·수정 시 공사 감독·감리 관계자와 충분히 협의 후 시행한다.</p><p class="pi">나. 분야별 담당은 계획을 수립하여 현장대리인에게 보고하고 승인을 받은 후 시행한다.</p><p class="pi">다. 현장대리인은 품질관리계획서(수정분 포함)를 관리·보관한다.</p>`),
   B(`<div class="h3">2.2.2 품질보증 절차</div><table class="fm small"><colgroup><col style="width:24%"><col></colgroup><tr><th>절 차</th><th>세 부 내 용</th></tr><tr><td class="c">계 획 수 립</td><td>품질보증계획서, 품질검사절차서, 시공계획서, 시공관리절차서, 품질관련절차서</td></tr><tr><td class="c">제 출</td><td>감리단의 확인을 받아 공사 착공 전 발주처에 제출</td></tr><tr><td class="c">검 토</td><td>검토 후 보완하여야 할 사항이 있는 경우 보완 요구</td></tr><tr><td class="c">확 인</td><td>감독원은 품질관리를 적정하게 실시하는지 여부를 확인</td></tr><tr><td class="c">완 료</td><td>확인결과 시정이 필요한 경우 시공사는 시정 후 그 결과를 발주처에 통보</td></tr></table>`),
   B(`<div class="h3">2.2.3 품질검사</div><p class="pp">검사는 계약서에 별도 제시가 있을 경우 그에 따르며, 명시되지 않은 경우 시방 지침 또는 관련 규격의 표준 및 규정에 따라 실시한다. 감독원의 품질검사 활동에 필요한 설비, 성적서, 도면, 목록 및 문서 등을 제공하고 관련 문서를 열람할 수 있도록 하며, 발주처 요구 시 검사에 협조한다.</p><div class="flow"><span class="b">자재 반입</span>→<span class="b">자재검수 요청</span>→<span class="b">감리 검수</span>→<span class="b">시공</span>→<span class="b">검측 요청</span>→<span class="b">감리 검측</span>→<span class="b">합격 시 다음 공정</span></div><p class="pp" style="font-size:13.5px">부적합 판정 시 : 부적합 보고(NCR) → 원인분석 및 시정조치 → 재검사 → 결과 기록·보관</p>`),
   B(`<div class="h2">2. 3 공종별 품질관리계획</div><p class="pp">공사가 설계도면 및 시방서 등에 일치되게 시공되는지 검사를 통하여 점검·확인함으로써 부주의, 착오, 미확인에 의한 부실시공을 사전에 예방한다. 이를 위해 현장대리인(시공책임자)이 점검·확인한 결과를 검측요청서 및 체크리스트에 기록하여 제출한다.</p><div class="h3">2.3.1 공정별 관리</div><p class="pi">① 공사의 진척사항 ② 특수작업에 대한 안전유무 확인 ③ 작업자의 안전공구 확인 ④ 현장 내 불완전 요소 제거 확인 ⑤ 안전거리 확보 여부 확인</p>`),
   B(`<div class="h3">2.3.2 자재관리</div><p class="pi">가. 수령된 자재는 종류별·규격별로 선별하여 관리한다.</p><p class="pi">나. 특수자재는 출입이 제한되는 실내에 보관한다.</p><p class="pi">다. 피복 입힌 전선류는 수분을 피해 저장·관리한다.</p><p class="pi">라. 관급자재는 별도의 자재관리대장으로 관리한다.</p>`),
   B(`<div class="h3">2.3.3 시공관리</div><p class="pi">가. 시공 : ${law}, 내선규정 등에 의거 성실히 시공하며, 도면과 시방서가 상이한 경우 감독관의 지시에 따른다.</p><p class="pi">나. 기기 및 자재 : KS 표시품을 사용하고, KS 규격이 없는 품목은 공인기관의 형식승인 또는 인증 제품으로 감독관의 승인을 받은 후 사용한다.</p><p class="pi">다. 관공서 수속 : 필요한 법적 절차는 관계 당국의 규정에 따라 완료하며 제반 경비는 도급자가 부담한다.</p><p class="pi">라. 현장대리인 : 법정 자격소지자를 현장대리인으로 상주시켜 항시 감독관의 지시에 따른다.</p><p class="pi">마. 공정관리 : 감독관이 지정한 공정에 이르렀을 때 검사를 받고 합격 승인을 얻은 후 다음 공정을 시공한다.</p><p class="pi">바. 입회 및 검사 : 시공 후 점검이 어려운 장소는 감독원 입회하에 시공하고 사진을 촬영하여 사진첩을 제출한다.</p><p class="pi">사. 현장관리 : 도난 및 청결에 유의하고, 시공자의 과실로 인한 시설물 파손은 시공자 부담으로 복구한다.</p>`),
   ...items.map((it,i)=>B(`${i===0?'<div class="h3">2.3.4 주요공정별 품질관리</div>':''}<p class="pi" style="margin-top:6px"><b>${esc(it[0])}</b></p><table class="fm small" style="font-size:12.5px"><colgroup><col style="width:14%"><col><col style="width:16%"></colgroup><tr><th>단계별</th><th>시 험 항 목</th><th>비 고</th></tr><tr><td class="c">1단계</td><td>${it[1].map(x=>'• '+esc(x)).join('<br>')}</td><td class="c">자재검사</td></tr><tr><td class="c">2단계</td><td>${it[2].map(x=>'• '+esc(x)).join('<br>')}</td><td class="c">품질검사</td></tr></table>`)),
   B(`<div class="h2" style="margin-top:12px">2. 4 품질기록 및 관리</div><p class="pp">본 절은 "${esc(P.name)}"에서 발생하는 품질기록의 식별, 수집, 색인, 파일링, 보관, 유지 및 처분 절차를 규정한다.</p><div class="h3">2.4.1 품질기록</div><p class="pi">현장에서 관리할 품질기록 : ① 자재청구서 ② 공정·장비·인원 기록 ③ 검사·시험결과 기록 ④ 계측기 교정검사 기록 ⑤ 부적합품 처리결과 ⑥ 시정조치 기록 ⑦ 자격부여 기록 ⑧ 교육·훈련 기록 ⑨ 사후서비스 기록 ⑩ 작업지시서 ⑪ 작업일지 등</p>`),
   B(`<div class="h3">2.4.2 책임과 권한</div><p class="pi">가. 현장대리인은 공무담당을 지정하여 품질기록을 관리토록 한다.</p><p class="pi">나. 공무담당은 품질기록을 관리할 책임이 있다.</p><div class="h3">2.4.3 품질기록 관리</div><p class="pi">가. 품질기록은 선명하고 식별·검색이 가능하도록 색인 및 파일링하며, 작성·검토·승인자의 서명 날인이 있어야 한다.</p><p class="pi">나. 기록은 최초 작성부서가 검토·수정하며 백색 수정액으로 변경할 수 없다.</p><p class="pi">다. 품질기록은 열화·손상·분실을 방지할 수 있는 장소에 보관하고, 허가 없이 반출할 수 없다.</p><div class="h3">2.4.4 품질기록의 처분</div><p class="pi">준공 시 품질기록 목록을 작성하여 해당 서류를 발주처에 인계하고, 자체 보존이 필요한 기록은 본사로 송부하여 필요한 기간 동안 보관한다.</p>`)];}

function docUnits(onlyOn){const out=[];DOCS.forEach(d=>{if(onlyOn&&!docOn(d))return;if(d.scoped)scopeKeys().forEach(k=>out.push({doc:d,sk:k,id:d.key+(P.longTerm?':'+k:''),label:d.title+(P.longTerm?` (${scopeLabel(k)})`:'')}));else out.push({doc:d,sk:null,id:d.key,label:d.title});});return out;}

function paginate(items,host){const pages=[];let body=null,flowCount=0;
  const newPage=(land)=>{const p=document.createElement('div');p.className='page'+(land?' land':'');const b=document.createElement('div');b.className='pbody';p.appendChild(b);host.appendChild(p);pages.push(p);return b;};
  for(const it of items){
    if(it.page!=null&&!it.merge){const b=newPage(it.land);b.innerHTML=it.page;if(it.empty)b.parentNode.dataset.empty='1';body=null;continue;}
    if(it.merge){body=newPage(false);const t=document.createElement('div');t.className='blk';t.innerHTML=it.page;body.appendChild(t);flowCount++;continue;}
    if(!body||it.newPage){body=newPage(false);flowCount++;}
    const t=document.createElement('div');t.className='blk';t.innerHTML=it.block;body.appendChild(t);
    if(body.scrollHeight>body.clientHeight+1&&body.children.length>1){body.removeChild(t);body=newPage(false);body.appendChild(t);}
  }
  return pages;}
function justifyLabels(root){root.querySelectorAll('.kv th, .sig th').forEach(th=>{if(th.children.length)return;const t=th.textContent.replace(/\s+/g,'');if(t.length>1)th.textContent=[...t].join(' ');});}
function renderUnit(u,host){const items=u.doc.scoped?RENDER[u.doc.key](u.sk):RENDER[u.doc.key]();const pages=paginate(items,host);pages.forEach(justifyLabels);
  const flowDoc=['safetyPlan','quality'].includes(u.doc.key);if(flowDoc&&pages.length>2){pages.slice(2).forEach((p,i)=>{const n=document.createElement('div');n.className='pno';n.textContent=`- ${i+1} -`;p.appendChild(n);});}
  return pages;}

const ATT_T={license:'자격증 사본',career:'경력확인서',sealCert:'인감증명서'};
function uploader(k,hint){const ids=P.attach[k]||[];const per=+P.attachLayout[k]||1;const t=ATT_T[k];

function sealSlot(k,t){const v=C[k];return `<div style="display:grid;gap:4px;justify-items:center"><div class="thumb sealbox">${v?`<img src="${v}" alt="${t}"><button class="x" data-act="delSeal" data-k="${k}" aria-label="삭제">✕</button>`:`<button class="drop sealbox" style="border:0" data-act="addSeal" data-k="${k}">+ ${t}</button>`}</div><span class="note">${t}</span></div>`;}

/* 계산 표시 갱신 */
function refreshCalcs(){const A=P.scopes.all,Fs=P.scopes.first;
  const cp=$('#calcPeriod');if(cp){const d=daysIncl(P.startDate,A.end);cp.innerHTML=`<span>공사기간</span><b>${d?`착공후 ${d}일`:'—'}${P.longTerm&&daysIncl(P.startDate,Fs.end)?` · 1차 ${daysIncl(P.startDate,Fs.end)}일`:''}</b>`;cp.className='calc fld full';}
  const s=P.scopes[formScope];
  const cs=$('#calcSched');if(cs){const rows=schedRows(formScope);const tw=rows.reduce((a,r)=>a+r.w,0);cs.innerHTML=`<span>보할 합계 · ${months(formScope).length}개월</span><b>${r2(tw)}%</b>`;cs.className='calc '+(Math.abs(tw-100)<0.01?'good':'bad');rows.forEach(r=>{if(!r.fixed){const el=document.querySelector(`[data-calc="w${r.idx}"]`);if(el)el.textContent=fmtPct(r.w);}});}
  const sf=$('#calcSafety');if(sf){const c=safetyCalc(s);const diff=c.sum-c.budget;sf.innerHTML=`<span>계상액 ${won(c.budget)} · 사용예정 ${won(c.sum)}</span><b>${diff>=0?'+':''}${won(diff)}원</b>`;sf.className='calc '+(c.budget&&diff<0?'bad':'good');
    SAFETY_CATS.forEach(([k])=>{const el=document.querySelector(`[data-calc="cat${k}"]`);if(el)el.textContent=won(c.cats[k])+'원';(s.safety[k]||[]).forEach((r,i)=>{const e2=document.querySelector(`[data-calc="it${k}${i}"]`);if(e2)e2.textContent=won(num(r.price)*num(r.qty));});});}
  const cd=$('#calcDirect');if(cd){const k=directCalc(s.direct);const diff=k.grand-num(s.amount);cd.innerHTML=`<span>소계 ${won(k.subtotal)} · 합계 ${won(k.total)} · 부가세 ${won(k.vat)}<br>도급금액 ${won(k.grand)} / 계약금액 ${won(s.amount)}</span><b>${diff===0?'일치':(diff>0?'+':'')+won(diff)}</b>`;cd.className='calc fld full '+(k.any?(diff===0?'good':'bad'):'');}
  const is=$('#issues');if(is){const list=validate();is.innerHTML=list.length?list.map(([lv,t])=>`<li><span class="lv ${lv}">${{e:'확인',w:'주의',i:'참고'}[lv]}</span><span>${t}</span></li>`).join(''):'<li><span class="lv i">완료</span><span>눈에 띄는 누락이 없습니다.</span></li>';}}

function validate(){const out=[];const A=P.scopes.all;
  if(!P.name)out.push(['e','공사명이 비어 있습니다.']);
  if(!C.name||!C.ceo)out.push(['e','회사명·대표자를 입력하세요 (기본정보).']);
  if(!P.owner)out.push(['e','수신(발주기관)이 비어 있습니다.']);
  if(!P.startDate||!A.end)out.push(['e','착공일과 준공예정일을 입력하세요.']);
  else if(pd(A.end)<pd(P.startDate))out.push(['e','준공예정일이 착공일보다 빠릅니다.']);
  if(pd(P.startDate)&&pd(P.contractDate)&&pd(P.startDate)<pd(P.contractDate))out.push(['w','착공일이 계약일보다 빠릅니다.']);
  if(P.longTerm){const F_=P.scopes.first;if(!num(F_.amount)||!F_.end)out.push(['e','1차 계약금액·준공예정일을 입력하세요.']);if(pd(F_.end)&&pd(A.end)&&pd(F_.end)>pd(A.end))out.push(['w','1차 준공예정일이 전체 준공예정일보다 늦습니다.']);}
  if(!P.agent.name)out.push(['e','현장대리인 성명이 없습니다.']);
  if(!P.agent.licNo)out.push(['w','현장대리인 자격번호가 없습니다.']);
  scopeKeys().forEach(k=>{const s=P.scopes[k];const L=P.longTerm?`(${scopeLabel(k)}) `:'';const d=directCalc(s.direct);
    if(docOn(DOCS.find(x=>x.key==='direct'))){if(!d.any)out.push(['w',`${L}직접시공계획서 원가 금액이 비어 있습니다.`]);else if(d.grand!==num(s.amount))out.push(['e',`${L}직접시공계획서 도급금액 ${won(d.grand)}원이 계약금액 ${won(s.amount)}원과 다릅니다 (차액 ${won(d.grand-num(s.amount))}원). 단수조정으로 맞추세요.`]);}
    const c=safetyCalc(s);if(c.budget&&c.sum<c.budget)out.push(['w',`${L}안전관리비 사용예정액(${won(c.sum)})이 계상액(${won(c.budget)})보다 ${won(c.budget-c.sum)}원 적습니다.`]);
    if(!c.budget)out.push(['w',`${L}안전관리비 계상액이 없습니다 (직접시공 탭 4. 안전관리비).`]);
    if(!s.sched.rows.length)out.push(['w',`${L}공정표 공종이 없습니다.`]);
    const rows=schedRows(k);rows.forEach(r=>{if(pd(r.e)&&pd(r.s)&&pd(r.e)<pd(r.s))out.push(['e',`${L}공정표 「${esc(r.name)}」 종료일이 시작일보다 빠릅니다.`]);if(pd(r.e)&&pd(s.end)&&pd(r.e)>pd(s.end))out.push(['w',`${L}공정표 「${esc(r.name)}」 종료일이 준공예정일 이후입니다.`]);});});
  DOCS.filter(d=>d.attach&&docOn(d)&&!(P.attach[d.attach]||[]).length).forEach(d=>out.push(['w',`${d.title} 이미지가 없어 내보내기에서 빠집니다.`]));
  if(!C.sealCorp&&!C.sealUse)out.push(['i','인감 이미지가 없으면 (인) 자리가 비어 있게 출력됩니다. 출력 후 날인해도 됩니다.']);
  return out;}

$('#form').addEventListener('input',e=>{const el=e.target;if(el.dataset.doc!==undefined)return;const path=el.dataset.path;if(!path)return;const src=el.dataset.src||'p';
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.money){const neg=/^\s*-/.test(v);const digits=v.replace(/[^\d]/g,'');v=digits===''?'':(neg?-1:1)*Number(digits);

  if(el.type==='number')v=el.value;
  if(src==='p'&&path.startsWith('plan47.')&&!(Array.isArray(P.plan47)&&P.plan47.length)){P.plan47=plan47Default();}
  if(src==='p'&&path.startsWith('plan47.'))focus47=true;
  setPath(rootOf(src),path,v);markDirty(src==='c'?'c':'p');

  scheduleRender();});
$('#form').addEventListener('change',e=>{const el=e.target;
  if(el.dataset.doc){P.docs[el.dataset.doc]=el.checked;markDirty('p');refreshCalcs();scheduleRender();return;}

$('#form').addEventListener('click',async e=>{const b=e.target.closest('[data-act],[data-show]');if(!b)return;
  if(b.dataset.show){const u=docUnits(false).find(x=>x.doc.key===b.dataset.show);if(u){curDoc=u.id;renderPreview();if(innerWidth<=900)setView('prev');}return;}

  if(act==='scope'){formScope=b.dataset.v;renderForm();const u=docUnits(false).find(x=>x.doc.key===TAB_DOC[tab]&&x.sk===formScope);if(u){curDoc=u.id;scheduleRender();}return;}
  if(act==='add'){const arr=getPath(root,b.dataset.arr)||[];const tmpl=b.dataset.arr==='workers'?{name:'',birth:'',role:''}:b.dataset.arr==='works'?{name:'',qty:'1식'}:b.dataset.arr==='sched.rows'?{name:'',amount:'',s:'',e:''}:{period:defaultPeriod(),name:'',unit:'',price:'',qty:''};arr.push(tmpl);setPath(root,b.dataset.arr,arr);markDirty('p');renderForm();scheduleRender();return;}
  if(act==='del'){const arr=getPath(root,b.dataset.arr)||[];arr.splice(+b.dataset.i,1);markDirty('p');renderForm();scheduleRender();return;}
  if(act==='fillSched'){const s=P.scopes[formScope];schedRows(formScope).forEach(r=>{if(r.fixed){const f=s.sched.fixed[r.key];f.s=f.s||r.s;f.e=f.e||r.e;}else{const x=s.sched.rows[r.idx];x.s=x.s||r.s;x.e=x.e||r.e;}});markDirty('p');renderForm();scheduleRender();return;}
  if(act==='clearSched'){const s=P.scopes[formScope];Object.values(s.sched.fixed).forEach(f=>{f.s='';f.e='';});s.sched.rows.forEach(r=>{r.s='';r.e='';});markDirty('p');renderForm();scheduleRender();return;}
  if(act==='copyAll'){const A=P.scopes.all,Fs=P.scopes.first;if(b.dataset.what==='sched'){Fs.sched.rows=A.sched.rows.map(r=>({name:r.name,amount:r.amount,s:'',e:''}));}else{Fs.safety=clone(A.safety);}markDirty('p');renderForm();scheduleRender();toast('전체 내용을 1차로 복사했습니다');return;}
  if(act==='p47Add'||act==='p47Del'||act==='p47Move'||act==='p47Reset'){if(act==='p47Reset'){P.plan47=null;}else{if(!(Array.isArray(P.plan47)&&P.plan47.length))P.plan47=plan47Default();const a=P.plan47,i=+b.dataset.i;
    if(act==='p47Add')a.push({title:'',body:''});if(act==='p47Del')a.splice(i,1);if(act==='p47Move'){const j=i+(+b.dataset.d);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];}if(!a.length)P.plan47=[{title:'',body:''}];}
    focus47=true;curDoc='safetyPlan';markDirty('p');renderForm();scheduleRender();return;}
  if(act==='orgEdit'){const a=orgAuto();P.org={custom:true,boxes:a.boxes,left:a.left,right:a.right};focusOrg=true;markDirty('p');renderForm();scheduleRender();return;}
  if(act==='orgReset'){P.org.custom=false;focusOrg=true;markDirty('p');renderForm();scheduleRender();return;}
  if(act==='orgAdd'||act==='orgAddSame'){const bs=P.org.boxes;const maxLv=bs.reduce((a,b)=>Math.max(a,num(b.lv)||1),0);bs.push({lv:act==='orgAdd'?maxLv+1:Math.max(maxLv,1),t:'',n:''});focusOrg=true;markDirty('p');renderForm();scheduleRender();return;}
  if(act==='orgMove'){const bs=P.org.boxes,i=+b.dataset.i,j=i+(+b.dataset.d);if(j>=0&&j<bs.length){[bs[i],bs[j]]=[bs[j],bs[i]];focusOrg=true;markDirty('p');renderForm();scheduleRender();}return;}
  if(act==='worksFromSched'){P.works=P.scopes.all.sched.rows.filter(r=>r.name).map(r=>({name:r.name,qty:'1식'}));markDirty('p');renderForm();scheduleRender();return;}
  if(act==='addImg'){pickImages(b.dataset.kind);return;}
  if(act==='layout'){P.attachLayout[b.dataset.kind]=+b.dataset.v;markDirty('p');renderForm();curDoc=b.dataset.kind;scheduleRender();return;}
  if(act==='imgMove'){const arr=P.attach[b.dataset.kind],i=+b.dataset.i,j=i+(+b.dataset.d);if(j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];markDirty('p');renderForm();curDoc=b.dataset.kind;scheduleRender();}return;}
  if(act==='delImg'){const arr=P.attach[b.dataset.kind];const [id]=arr.splice(+b.dataset.i,1);markDirty('p');renderForm();scheduleRender();try{await Store.deleteImg(id);}catch(_){}delete imgCache[id];return;}
  if(act==='addSeal'){pickSeal(b.dataset.k);return;}
  if(act==='delSeal'){C[b.dataset.k]='';markDirty('c');renderForm();scheduleRender();return;}
  if(act==='pdf'){exportPdf();return;}
  if(act==='html'){exportHtml();return;}
  if(act==='backup'){exportBackup();return;}
  if(act==='restore'){$('#fileJson').click();return;}
});
function defaultPeriod(){const a=pd(P.startDate),b=pd(P.scopes[formScope].end);return a&&b?`${a.getUTCFullYear()}.${p2(a.getUTCMonth()+1)} ~ ${b.getUTCFullYear()}.${p2(b.getUTCMonth()+1)}`:'';}

/* ================= 이미지 ================= */
function loadImageFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
function compress(im,maxSide,type,limit){let side=maxSide,q=.85,out='';for(let i=0;i<8;i++){const sc=Math.min(1,side/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const g=c.getContext('2d');if(type==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);}g.drawImage(im,0,0,c.width,c.height);out=c.toDataURL(type,q);if(out.length<limit)return out;side*=.82;q=Math.max(.55,q-.08);}return out;}
let pickKind=null,pickMode='img';
function pickImages(kind){pickKind=kind;pickMode='img';const fi=$('#fileImg');fi.multiple=true;fi.value='';fi.click();}
function pickSeal(k){pickKind=k;pickMode='seal';const fi=$('#fileImg');fi.multiple=false;fi.value='';fi.click();}
async function addFiles(files){files=files.filter(f=>{if(/^image\//.test(f.type))return true;toast(f.name+' : 이미지 파일(JPG·PNG)만 올릴 수 있습니다. PDF는 이미지로 저장해 올려주세요.',4000);return false;});if(!files.length)return;
  for(const f of files){try{const im=await loadImageFile(f);
    if(pickMode==='seal'){C[pickKind]=sealize(im);markDirty('c');}
    else{const data=compress(im,2000,'image/jpeg',900000);const id='i'+uid();imgCache[id]=data;await Store.saveImg(id,data);P.attach[pickKind].push(id);markDirty('p');}}
    catch(err){toast('이미지를 저장하지 못했습니다. 더 작은 이미지로 다시 시도하세요.');}}
  renderForm();if(pickMode==='img')curDoc=pickKind;scheduleRender();if(pickMode==='img')toast(files.length+'장을 올렸습니다');}
$('#fileImg').addEventListener('change',e=>addFiles([...e.target.files]));
$('#form').addEventListener('dragover',e=>{const d=e.target.closest('.drop[data-kind]');if(!d)return;e.preventDefault();d.classList.add('over');});
$('#form').addEventListener('dragleave',e=>{const d=e.target.closest('.drop[data-kind]');if(d)d.classList.remove('over');});
$('#form').addEventListener('drop',e=>{const d=e.target.closest('.drop[data-kind]');if(!d)return;e.preventDefault();d.classList.remove('over');pickKind=d.dataset.kind;pickMode='img';addFiles([...(e.dataTransfer.files||[])]);});
/* 인감: 흰 배경을 투명하게, 붉은 인영만 남김 */
function sealize(im){const sc=Math.min(1,320/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
  try{const d=g.getImageData(0,0,c.width,c.height);const a=d.data;for(let i=0;i<a.length;i+=4){const r=a[i],gg=a[i+1],b=a[i+2];const light=(r+gg+b)/3;if(light>215&&Math.max(r,gg,b)-Math.min(r,gg,b)<40)a[i+3]=0;}g.putImageData(d,0,0);}catch(_){}
  return c.toDataURL('image/png');}
async function loadProjectImages(p){const ids=[...(p.attach.license||[]),...(p.attach.career||[]),...(p.attach.sealCert||[])].filter(id=>!imgCache[id]);if(!ids.length)return;
  await Promise.all(ids.map(async id=>{try{const d=await Store.loadImg(id);if(d)imgCache[id]=d;}catch(_){}}));if(p===P){if(tab==='attach')renderForm();scheduleRender();}}

/* ================= 프로젝트 관리 ================= */
function renderProjSel(){const s=$('#projSel');const list=[...projects].sort((a,b)=>(b.updated||0)-(a.updated||0));s.innerHTML=list.map(p=>`<option value="${p.id}" ${p.id===P.id?'selected':''}>${p._example?'[예시] ':''}${esc(p.name||'(공사명 없음)')}</option>`).join('');}
function openProject(p){P=normalize(p);const i=projects.findIndex(x=>x.id===P.id);if(i>=0)projects[i]=P;formScope='all';renderProjSel();renderForm();scheduleRender();loadProjectImages(P);}
$('#projSel').addEventListener('change',e=>{const p=projects.find(x=>x.id===e.target.value);if(p)openProject(p);});
$('#btnNew').onclick=()=>{const p=emptyProject();p.name='';p.owner='';p.startDate='';projects=projects.filter(x=>!x._example);projects.push(p);tab='basic';renderTabs();openProject(p);markDirty('p');toast('새 프로젝트를 만들었습니다. 공사명부터 입력하세요.');};
$('#btnDup').onclick=()=>{const p=clone(P);p.id=uid();delete p._example;p.name=(P.name||'공사')+' (사본)';p.updated=Date.now();p.attach={license:[],career:[],sealCert:[]};projects.push(p);openProject(p);markDirty('p');toast('복제했습니다. 첨부 이미지는 복제되지 않습니다.');};
function renderDel(){const w=$('#delWrap');if(!delConfirm){w.innerHTML='<button class="btn danger" id="btnDel">삭제</button>';$('#btnDel').onclick=()=>{delConfirm=true;renderDel();};return;}
  w.innerHTML=`<span class="confirm">「${esc(P.name||'이 프로젝트')}」를 지울까요? <button class="btn sm danger" id="delYes">삭제</button><button class="btn sm" id="delNo">취소</button></span>`;
  $('#delNo').onclick=()=>{delConfirm=false;renderDel();};
  $('#delYes').onclick=async()=>{const p=P;delConfirm=false;renderDel();projects=projects.filter(x=>x.id!==p.id);

    if(!projects.length)projects=[exampleProject()];openProject(projects[0]);toast('삭제했습니다');};}

/* ================= 내보내기 ================= */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function saveFile(filename,data,mime){let dl=null;try{dl=window.claude&&window.claude.use?await claude.use('downloads'):null;}catch(_){}
  if(dl){try{await dl.save({filename,data});return true;}catch(e){if(e&&e.code==='declined')return false;toast('파일을 저장하지 못했습니다: '+(e&&e.message||e&&e.code||''));return false;}}
  try{const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);return true;}catch(e){toast('이 화면에서는 파일 저장을 지원하지 않습니다.');return false;}}
const safeName=s=>(s||'착공계').replace(/[\\/:*?"<>|]/g,'').slice(0,60);
function overlay(text){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="box"><b id="ovT">${esc(text)}</b><div class="bar-out"><div class="bar-in" id="ovB"></div></div><span class="note" id="ovN"></span></div>`;document.body.appendChild(o);return {set(p,n){$('#ovB').style.width=(p*100)+'%';$('#ovN').textContent=n||'';},close(){o.remove();}};}
async function buildAllPages(host){await ensureFonts();const units=docUnits(true);const pages=[];for(const u of units){const ps=renderUnit(u,host).filter(p=>!p.dataset.empty);pages.push(...ps);}return pages;}
async function exportPdf(){const ov=overlay('PDF 만드는 중…');try{
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const host=document.createElement('div');host.className='export-host';document.body.appendChild(host);
  const pages=await buildAllPages(host);if(!pages.length){toast('내보낼 서류가 없습니다');return;}
  const {jsPDF}=window.jspdf;let pdf=null;
  for(let i=0;i<pages.length;i++){const p=pages[i];const land=p.classList.contains('land');ov.set(i/pages.length,`${i+1} / ${pages.length}쪽`);
    host.innerHTML='';host.appendChild(p);
    const canvas=await html2canvas(p,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:0,windowWidth:1200});
    const img=canvas.toDataURL('image/jpeg',.9);const w=land?297:210,h=land?210:297;
    if(!pdf)pdf=new jsPDF({unit:'mm',format:'a4',orientation:land?'l':'p'});else pdf.addPage('a4',land?'l':'p');
    pdf.addImage(img,'JPEG',0,0,w,h);await new Promise(r=>setTimeout(r,0));}
  host.remove();ov.set(1,'저장 준비');const buf=pdf.output('arraybuffer');
  const ok=await saveFile(`${safeName(P.name)}_착공계.pdf`,buf,'application/pdf');if(ok)toast(`PDF ${pages.length}쪽을 저장했습니다`);}
  catch(e){toast('PDF를 만들지 못했습니다. 인쇄용 HTML 저장을 이용해 주세요.');}
  finally{ov.close();document.querySelectorAll('.export-host').forEach(x=>x.remove());}}
async function exportHtml(){const ov=overlay('인쇄용 파일 만드는 중…');try{const host=document.createElement('div');host.className='measure';document.body.appendChild(host);
  const pages=await buildAllPages(host);const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const doc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(P.name)} 착공계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700&display=swap">
<style>${css}
html,body{height:auto;overflow:visible;background:#888;margin:0}
.page{margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.3)}
@page{size:A4 portrait;margin:0}
@page land{size:A4 landscape;margin:0}
.page.land{page:land}
@media print{body{background:#fff}.page{margin:0;box-shadow:none;break-after:page}}
</style></head><body>${pages.map(p=>p.outerHTML).join('\n')}</body></html>`;
  host.remove();const ok=await saveFile(`${safeName(P.name)}_착공계_인쇄용.html`,doc,'text/html');if(ok)toast(`${pages.length}쪽 인쇄용 파일을 저장했습니다`);}
  catch(e){toast('인쇄용 파일을 만들지 못했습니다.');}finally{ov.close();}}
async function exportBackup(){const ov=overlay('백업 파일 만드는 중…');try{const images={};for(const p of projects.filter(x=>!x._example)){for(const id of [...p.attach.license,...p.attach.career,...p.attach.sealCert]){if(!imgCache[id]){try{imgCache[id]=await Store.loadImg(id);}catch(_){}}if(imgCache[id])images[id]=imgCache[id];}}
  const data={app:'착공계원스톱',version:1,exported:new Date().toISOString(),company:C,projects:projects.filter(x=>!x._example),images};
  const d=new Date();await saveFile(`착공계_백업_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`,JSON.stringify(data),'application/json');}
  finally{ov.close();}}
$('#fileJson').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='착공계원스톱')throw new Error('형식');

    for(const p of data.projects||[]){const n=normalize(p);delete n._example;const i=projects.findIndex(x=>x.id===n.id);if(i>=0)projects[i]=n;else projects.push(n);await Store.saveProject(n);}
    projects=projects.filter(x=>!x._example);if(!projects.length)projects=[exampleProject()];openProject(projects[0]);toast(`프로젝트 ${(data.projects||[]).length}개를 불러왔습니다`);}finally{ov.close();}}
  catch(err){toast('백업 파일을 읽지 못했습니다. 이 프로그램에서 저장한 JSON인지 확인하세요.');}e.target.value='';});

})();
